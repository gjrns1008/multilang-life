<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생활 외국어 · 한국어 일본어 영어 중국어 우한말</title>
<style>
:root{--blue:#2f4fd1;--bg:#f3f5fb;--ink:#1c2333;--muted:#6a7388;--line:#e3e7f1;--ok:#13885a;--bad:#d23c3c;--gold:#f0a500}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Malgun Gothic","PingFang SC","Hiragino Sans",sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px 14px 80px}
header{background:linear-gradient(120deg,#1f3590,#4a6be0);color:#fff;border-radius:18px;padding:16px 20px;margin-bottom:12px}
header h1{margin:0 0 2px;font-size:22px}header p{margin:0;color:#dfe6ff;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.sel{display:flex;gap:10px;flex-wrap:wrap}
.sel label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.sel select{border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:#fff;min-width:130px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
nav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font:inherit;font-weight:650;cursor:pointer;min-width:70px}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:650;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:#e9edfb;color:#2b3f9e}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tier{font-weight:800;margin:14px 2px 6px;color:#2b3f9e}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.unit{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer}
.unit:hover{border-color:var(--blue)}.unit b{display:block}.unit small{color:var(--muted)}
.bar{height:6px;background:#e9edfb;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:32px;line-height:1.35;margin:6px 0;word-break:keep-all}
.rom{color:#7a5400;background:#fff6dd;border-radius:8px;padding:3px 9px;display:inline-block;font-size:15px;margin:2px 0}
.mean{font-size:18px;color:#2b3f9e;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:7px 0;font:inherit;cursor:pointer}
.opt.right{background:#e6f6ee;border-color:var(--ok)}.opt.wrong{background:#fde8e8;border-color:var(--bad)}
.hide{display:none}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;background:#eef1fb;color:#3a4fb0;margin-right:4px}
.note{background:#fff8e6;border:1px solid #f1deaa;color:#6d5412;border-radius:12px;padding:9px 12px;font-size:13px;margin:8px 0}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}.list .t{flex:1}.list .t b{font-size:18px}
.st{font-size:11px;border-radius:10px;padding:1px 7px;background:#eef1fb;color:#566}
.st.k{background:#e6f6ee;color:var(--ok)}
.w{border-bottom:1px solid var(--line);padding:10px 0}.w b{font-size:22px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🌏 생활 외국어</h1><p>한국어 · 日本語 · English · 中文 · 우한말 — 실생활에서 제일 많이 쓰는 말부터</p></header>

<div class="card"><div class="sel">
 <div><label>내 언어 (뜻 표시)</label><select id="my"></select></div>
 <div><label>배울 언어</label><select id="lang"></select></div>
</div><div class="note hide" id="wuNote">한 카드에 <b>표준 중국어</b>와 <b>우한말</b>이 같이 나옵니다. 우한말 병음은 표준어 기준 근사 표기이고 성조는 실제 우한 억양과 다릅니다. 🔊는 표준 중국어 발음으로만 재생돼요. 우한 현지인 발음은 직접 들어 보세요.</div></div>

<nav id="nav">
 <button data-v="home">📚 학습</button><button data-v="review">🔁 복습</button><button data-v="quiz">🎯 퀴즈</button><button data-v="words">🍜 우한말</button><button data-v="prog">📈 진도</button>
</nav>
<div id="view"></div>
</div>

<script>
const D=/*DATA*/null;
const LN={ko:'한국어',ja:'日本語',en:'English',zh:'中文 (표준)',zw:'중국어 + 우한말 (普通话+武汉话)'};
const TTS={ko:'ko-KR',ja:'ja-JP',en:'en-US',zh:'zh-CN',zw:'zh-CN'};
const $=s=>document.querySelector(s);
const store=JSON.parse(localStorage.getItem('ml_state')||'{}');
const fixL=x=>x==='wu'?'zw':x;
const S={my:store.my==='wu'?'ko':(store.my||'ko'),lang:fixL(store.lang||'ja'),view:'home',unit:null,prog:store.prog||{},sess:null};
const save=()=>localStorage.setItem('ml_state',JSON.stringify({my:S.my,lang:S.lang,prog:S.prog}));
const INT=[0,1,3,7,14,30,60];
const DAY=864e5;
const uorder={};D.units.forEach((u,i)=>uorder[u.k]=i);
const tierOf={};D.units.forEach(u=>tierOf[u.k]=u.t);

const txt=(c,l)=>l==='zw'?c.zh:c[l];
function rom(c,l){
  if(l==='ko')return c.r.ko; if(l==='ja')return c.r.jh+'　'+c.r.jr; if(l==='zh')return c.r.zh;
  if(l==='zw')return c.r.zh; return '';}
const speakTxt=(c,l)=>l==='zw'?c.zh:c[l];
function mean(c){let m=txt(c,S.my);return c.m?m+'  ('+c.m+')':m}
const key=c=>S.lang+':'+c.id;
const P=c=>S.prog[key(c)]||{b:0,d:0};
function mark(c,good){const p=P(c);p.b=good?Math.min(INT.length-1,p.b+1):0;p.d=Date.now()+(good?INT[p.b]*DAY:0);S.prog[key(c)]=p;save()}
const known=c=>P(c).b>=3;
function items(unit){return D.c.filter(c=>!unit||c.u===unit)}
function due(){return D.c.filter(c=>{const p=S.prog[key(c)];return p&&p.d<=Date.now()}).sort((a,b)=>uorder[a.u]-uorder[b.u])}
function fresh(unit){return items(unit).filter(c=>!S.prog[key(c)])}


function hl(wu,zh){const z=new Set(zh);return [...wu].map(ch=>/[\u4e00-\u9fff]/.test(ch)&&!z.has(ch)?`<span style="color:#d23c3c;font-weight:800">${ch}</span>`:ch).join('')}
function wuBlock(c,small){
  const same=!c.wu||c.wu===c.zh;
  return `<div style="margin-top:10px;padding:10px;border-radius:12px;background:#fff6f0;border:1px solid #f3d3bd;text-align:${small?'left':'center'}">
   <span class="tag" style="background:#ffe4d1;color:#a24a10">우한말 武汉话</span>
   ${same?`<div class="${small?'':'big'}" style="${small?'font-size:18px':'font-size:26px'}">${c.zh}</div><div class="muted">표준어와 같아요</div>`
          :`<div style="${small?'font-size:18px':'font-size:28px'};line-height:1.4">${hl(c.wu,c.zh)}</div><div class="rom">${c.r.wu}</div>`}
   ${small?'':`<div class="row" style="justify-content:center;margin-top:6px"><button class="btn sec" onclick='speak(${JSON.stringify(c.zh)},"zh")'>🔊 (표준 발음으로 재생)</button></div>`}
  </div>`}
function show(c,l){
  let h=`<div class="big">${txt(c,l)}</div>${rom(c,l)?`<div class="rom">${rom(c,l)}</div>`:''}`;
  if(l==='zw')h=`<span class="tag">표준 중국어 普通话</span>`+h+wuBlock(c,false);
  return h}

function speak(t,l){
  if(!('speechSynthesis' in window))return alert('이 브라우저는 음성 재생을 지원하지 않아요.');
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=TTS[l]||l;u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang.replace('_','-').startsWith(u.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
speechSynthesis&&speechSynthesis.getVoices();

function init(){
  for(const k in LN){['#my','#lang'].forEach(id=>{if(id==='#my'&&k==='zw')return;if(id==='#lang'&&k==='zh')return;$(id).add(new Option(LN[k],k))})}
  $('#my').value=S.my;$('#lang').value=S.lang;
  $('#my').onchange=()=>{S.my=$('#my').value;if(S.my===S.lang||(S.my==='zh'&&S.lang==='zw')){S.lang=S.my==='ja'?'en':'ja';$('#lang').value=S.lang}save();render()};
  $('#lang').onchange=()=>{S.lang=$('#lang').value;if(S.lang===S.my||(S.lang==='zw'&&S.my==='zh')){S.my=S.lang==='ko'?'zh':'ko';$('#my').value=S.my}save();render()};
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.unit=null;S.sess=null;render()});
  render();
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('#wuNote').classList.toggle('hide',S.lang!=='zw');
  const v=$('#view');
  ({home:vHome,review:vReview,quiz:vQuiz,words:vWords,prog:vProg})[S.view](v);
}

/* ---- 학습 홈 ---- */
function vHome(v){
  if(S.unit)return vUnit(v);
  const dn=due().length;let h='';
  if(dn)h+=`<div class="card">오늘 복습할 카드 <b>${dn}개</b> <button class="btn" style="margin-left:8px" onclick="S.view='review';render()">복습하기</button></div>`;
  h+=`<div class="muted" style="margin:0 2px 4px">순서대로 공부하면 일상에서 가장 많이 쓰는 말부터 익혀요.</div>`;
  for(const t of [1,2,3,4]){
    h+=`<div class="tier">${D.tiers[t]}</div><div class="units">`;
    for(const u of D.units.filter(x=>x.t===t)){
      const it=items(u.k),k=it.filter(known).length;
      h+=`<div class="unit" onclick="S.unit='${u.k}';S.sess=null;render()"><b>${u.e} ${u.n}</b><small>${k}/${it.length} 익힘</small><div class="bar"><i style="width:${k/it.length*100}%"></i></div></div>`}
    h+='</div>'}
  v.innerHTML=h}

function vUnit(v){
  const u=D.units.find(x=>x.k===S.unit),it=items(u.k);
  if(S.sess&&S.sess.mode==='study')return vStudy(v);
  let h=`<div class="row" style="margin:0 0 8px"><button class="btn sec" onclick="S.unit=null;render()">◀ 목록</button><b>${u.e} ${u.n}</b></div>
  <div class="card"><div class="row" style="margin:0"><button class="btn" onclick="startStudy('${u.k}')">▶ 학습 시작 (새 카드 ${fresh(u.k).length}개)</button>
  <button class="btn sec" onclick="startQuiz('${u.k}')">🎯 이 단원 퀴즈</button></div></div><div class="card list">`;
  it.forEach(c=>{h+=`<div class="it"><div class="t"><b>${txt(c,S.lang)}</b><br><span class="muted">${rom(c,S.lang)}</span>${S.lang==='zw'?wuBlock(c,true):''}<br><span class="muted">${mean(c)}</span></div>
   <span class="st ${known(c)?'k':''}">${known(c)?'익힘':P(c).d?'학습중':'새'}</span><button class="btn sec" onclick='speak(${JSON.stringify(speakTxt(c,S.lang))},"${S.lang}")'>🔊</button></div>`});
  v.innerHTML=h+'</div>'}

/* ---- 카드 학습 ---- */
function startStudy(unit){let q=fresh(unit);if(!q.length)q=items(unit).filter(c=>!known(c));if(!q.length)q=items(unit);
  S.sess={mode:'study',q:[...q],i:0,show:false,unit,done:0};render()}
function vStudy(v){return runCards(v,()=>{S.unit=S.sess.unit;S.sess=null;render()})}
function runCards(v,back){
  const s=S.sess;
  if(!s.q.length){v.innerHTML=`<div class="card"><div class="big">🎉 완료!</div><p class="muted">오늘 ${s.done}개를 공부했어요.</p><button class="btn" id="bk">돌아가기</button></div>`;$('#bk').onclick=back;return}
  const c=s.q[0];
  v.innerHTML=`<div class="muted" style="margin:0 2px 6px">남은 카드 ${s.q.length}개</div>
  <div class="card" style="text-align:center">
   ${show(c,S.lang)}
   <div class="row" style="justify-content:center"><button class="btn sec" id="sp">🔊 듣기</button></div>
   <div class="mean ${s.show?'':'hide'}" id="mn">${mean(c)}</div>
   <div class="row" style="justify-content:center">
    ${s.show?`<button class="btn bad" id="no">몰라요</button><button class="btn ok" id="yes">알아요</button>`:`<button class="btn" id="rv">뜻 보기</button>`}
   </div></div>
   <div class="row" style="margin:0"><button class="btn sec" id="bk">◀ 그만하기</button></div>`;
  $('#sp').onclick=()=>speak(speakTxt(c,S.lang),S.lang);
  $('#bk').onclick=back;
  if(!s.show){$('#rv').onclick=()=>{s.show=true;render()};setTimeout(()=>speak(speakTxt(c,S.lang),S.lang),150)}
  else{ $('#yes').onclick=()=>{mark(c,true);s.q.shift();s.done++;s.show=false;render()};
        $('#no').onclick=()=>{mark(c,false);s.q.push(s.q.shift());s.show=false;render()}}}

/* ---- 복습 ---- */
function vReview(v){
  if(!S.sess||S.sess.mode!=='review'){const q=due().slice(0,20);S.sess={mode:'review',q,done:0,show:false}}
  if(!S.sess.q.length&&!S.sess.done){v.innerHTML=`<div class="card"><div class="big">✨ 복습할 카드가 없어요</div><p class="muted">학습 탭에서 새 단원을 시작해 보세요.</p></div>`;return}
  runCards(v,()=>{S.view='home';S.sess=null;render()})}

/* ---- 퀴즈 ---- */
function startQuiz(unit){
  let pool=unit?items(unit):D.c.filter(c=>S.prog[key(c)]);
  if(pool.length<4)pool=D.c.filter(c=>tierOf[c.u]<=(unit?tierOf[unit]:1));
  S.sess={mode:'quiz',unit,pool,n:0,ok:0,total:10,cur:null};S.view='quiz';S.unit=null;render()}
function vQuiz(v){
  const s=S.sess;
  if(!s||s.mode!=='quiz'){
    v.innerHTML=`<div class="card"><b>🎯 퀴즈</b><p class="muted">틀린 문제는 복습 카드에 다시 들어가요. 10문제씩.</p><div class="row">
    <button class="btn" onclick="startQuiz(null)">배운 내용 전체</button>
    <button class="btn sec" onclick="S.view='home';render()">단원별 퀴즈는 학습 탭에서</button></div></div>`;return}
  if(s.n>=s.total){v.innerHTML=`<div class="card"><div class="big">${s.ok} / ${s.total}</div><p class="muted">${s.ok>=9?'완벽해요!':s.ok>=7?'잘했어요!':'조금 더 복습하면 좋아요.'}</p>
   <div class="row"><button class="btn" onclick="startQuiz(${s.unit?`'${s.unit}'`:'null'})">다시</button><button class="btn sec" onclick="S.sess=null;S.view='home';render()">학습으로</button></div></div>`;return}
  const c=s.pool[Math.floor(Math.random()*s.pool.length)];
  const types=['listen','tr','rt'];const type=('speechSynthesis' in window)?types[Math.floor(Math.random()*3)]:types[1+Math.floor(Math.random()*2)];
  const dist=[];const pool=D.c.filter(x=>x.id!==c.id&&(x.u===c.u||dist.length<3));
  const sh=a=>a.sort(()=>Math.random()-.5);
  let others=sh(D.c.filter(x=>x.id!==c.id&&x.u===c.u)).slice(0,3);
  if(others.length<3)others=others.concat(sh(D.c.filter(x=>x.id!==c.id&&!others.includes(x))).slice(0,3-others.length));
  const opts=sh([c,...others]);
  const q=type==='rt'?`<div class="mean" style="margin:0">${mean(c)}</div><div class="muted">${LN[S.lang]}로 뭐라고 해요?</div>`
      :type==='listen'?`<div class="row" style="margin:0"><button class="btn" id="lp">🔊 듣고 뜻 고르기</button></div>`
      :`${show(c,S.lang)}<div class="muted" style="margin-top:8px">무슨 뜻일까요?</div>`;
  v.innerHTML=`<div class="muted" style="margin:0 2px 6px">${s.n+1} / ${s.total} · 정답 ${s.ok}</div><div class="card">${q}<div id="op" style="margin-top:8px"></div></div>
  <div class="row" style="margin:0"><button class="btn sec" onclick="S.sess=null;S.view='home';render()">◀ 그만하기</button></div>`;
  if(type==='listen'){$('#lp').onclick=()=>speak(speakTxt(c,S.lang),S.lang);setTimeout(()=>speak(speakTxt(c,S.lang),S.lang),200)}
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=type==='rt'?txt(o,S.lang):mean(o);
    b.onclick=()=>{const good=o.id===c.id;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      b.classList.add(good?'right':'wrong');if(!good)[...document.querySelectorAll('.opt')].find(x=>x.textContent===(type==='rt'?txt(c,S.lang):mean(c))).classList.add('right');
      mark(c,good);if(good)s.ok++;s.n++;
      const nx=document.createElement('div');nx.className='row';nx.innerHTML='<button class="btn">다음</button>';nx.firstChild.onclick=render;$('#op').appendChild(nx)};
    $('#op').appendChild(b)})}

/* ---- 우한말 ---- */
function vWords(v){
  let h=`<div class="card"><b>🍜 우한말(武汉话) 핵심 단어</b><div class="note">표준 중국어와 다르게 우한에서 일상적으로 쓰는 말이에요. 배울 언어를 <b>중국어 + 우한말</b>로 두면 모든 생활 문장을 표준 중국어와 우한말로 나란히 공부해요. 우한말에서 표준어와 다른 글자는 <b style="color:#d23c3c">빨간색</b>으로 표시됩니다.</div>
  <div class="row" style="margin:0"><button class="btn sec" onclick="S.lang='zw';if(S.my==='zh')S.my='ko';$('#my').value=S.my;$('#lang').value='zw';save();S.view='home';render()">중국어 + 우한말 함께 공부하기</button></div></div><div class="card">`;
  D.words.forEach(w=>{h+=`<div class="w"><b>${w.wu}</b> <span class="rom">${w.py}</span> <button class="btn sec" style="padding:4px 10px" onclick='speak(${JSON.stringify(w.sp)},"zh")'>🔊</button>
   <div class="mean" style="margin-top:2px">${w.ko}</div><div class="muted">표준어: ${w.zh}</div><div class="muted">${w.note}</div></div>`});
  v.innerHTML=h+'</div>'}

/* ---- 진도 ---- */
function vProg(v){
  const all=D.c,k=all.filter(known).length,st=all.filter(c=>S.prog[key(c)]).length;
  let h=`<div class="card"><b>${LN[S.lang]}</b><div class="big">${k} / ${all.length} 익힘</div><div class="muted">시작한 카드 ${st}개 · 오늘 복습 ${due().length}개</div><div class="bar"><i style="width:${k/all.length*100}%"></i></div></div>`;
  for(const t of [1,2,3,4]){const it=all.filter(c=>tierOf[c.u]===t),kk=it.filter(known).length;
    h+=`<div class="card"><b>${D.tiers[t]}</b> <span class="muted">${kk}/${it.length}</span><div class="bar"><i style="width:${kk/it.length*100}%"></i></div></div>`}
  h+=`<div class="card"><div class="muted">진도는 이 브라우저에만 저장됩니다.</div><div class="row"><button class="btn bad" onclick="if(confirm('이 언어의 진도를 초기화할까요?')){for(const k in S.prog)if(k.startsWith(S.lang+':'))delete S.prog[k];save();render()}">이 언어 진도 초기화</button></div></div>`;
  v.innerHTML=h}
init();
</script>
</body>
</html>
