d here?", "zh": "你在这里住多久了？", "wu": null, "m": null, "id": 1123, "r": {"ko": "neo yeogiseo san ji eolmana dwaesseo?", "jh": "ここにすんでどれぐらい", "jr": "koko ni sun de doregurai", "zh": "nǐ zài zhè lǐ zhù duō jiǔ le?", "wu": ""}}, {"u": "t_misc", "ko": "마실 게 있었으면 좋겠다.", "ja": "何か飲み物が欲しいな。", "en": "I want something to drink.", "zh": "我想喝点什么。", "wu": null, "m": null, "id": 1124, "r": {"ko": "masil ge isseosseumyeon joketda.", "jh": "なんかのみものがほしいな", "jr": "nanka nomimono ga hoshiina", "zh": "wǒ xiǎng hē diǎn shén me.", "wu": ""}}, {"u": "t_feel", "ko": "난 언어를 배우는 것을 좋아해.", "ja": "外国語を勉強することが好きです。", "en": "I like learning languages.", "zh": "我喜欢学习语言。", "wu": null, "m": null, "id": 1125, "r": {"ko": "nan eoneoreul baeuneun geoseul joahae.", "jh": "がいこくごをべんきょうすることがすきです", "jr": "gaikokugo o benkyou suru koto ga sukidesu", "zh": "wǒ xǐ huān xué xí yǔ yán.", "wu": ""}}, {"u": "t_misc", "ko": "나는 지난주에 그를 봤다.", "ja": "先週彼に会いました。", "en": "I saw him last week.", "zh": "我上周见到了他。", "wu": null, "m": null, "id": 1126, "r": {"ko": "naneun jinanjue geureul bwatda.", "jh": "せんしゅうかれにあいました", "jr": "senshuu kare ni aimashita", "zh": "wǒ shàng zhōu jiàn dào le tā.", "wu": ""}}, {"u": "t_feel", "ko": "바라는 것이 없으면 부족함이 없다.", "ja": "欲しくないという事は持っていると同じことだ。", "en": "Not wanting is the same as having.", "zh": "没有欲望就等于拥有。", "wu": null, "m": null, "id": 1127, "r": {"ko": "baraneun geosi eopseumyeon bujokhami eopda.", "jh": "ほしくないということはもっているとおなじことだ", "jr": "hoshiku nai to iu koto wa motteiru to onaji kotoda", "zh": "méi yǒu yù wàng jiù děng yú yōng yǒu.", "wu": ""}}, {"u": "t_misc", "ko": "그들은 나를 위해 큰 파티를 열어 줬어.", "ja": "彼らは私のために盛大なパーティーを開いてくれた。", "en": "They gave a big party for me.", "zh": "他们为我办了一个盛大的派对。", "wu": null, "m": null, "id": 1128, "r": {"ko": "geudeureun nareul wihae keun patireul yeoreo jwosseo.", "jh": "かれらはわたしのためにせいだいなパーティーをひらいてくれた", "jr": "karera wa watashi no tame ni seidaina paateii o hiraite kureta", "zh": "tā men wèi wǒ bàn le yí gè shèng dà de pài duì.", "wu": ""}}, {"u": "t_move", "ko" ": "wǒ hèn nǐ!", "wu": ""}}, {"u": "t_misc", "ko": "진지하게 해.", "ja": "冗談はやめて。", "en": "Get serious.", "zh": "认真点。", "wu": null, "m": null, "id": 1977, "r": {"ko": "jinjihage hae.", "jh": "じょうだんはやめて", "jr": "joudan wa yamete", "zh": "rèn zhēn diǎn.", "wu": ""}}, {"u": "t_misc", "ko": "저, 그만 두겠습니다.", "ja": "私、辞めます。", "en": "I quit.", "zh": "我退出。", "wu": null, "m": null, "id": 1978, "r": {"ko": "jeo, geuman dugetseupnida.", "jh": "わたしやめます", "jr": "watashi yamemasu", "zh": "wǒ tuì chū.", "wu": ""}}, {"u": "t_misc", "ko": "쉽지 않습니다.", "ja": "簡単ではないな。", "en": "It's not easy.", "zh": "这并不简单。", "wu": null, "m": null, "id": 1979, "r": {"ko": "swipji ansseupnida.", "jh": "かんたんではないな", "jr": "kantande wa naina", "zh": "zhè bìng bù jiǎn dān.", "wu": ""}}, {"u": "t_misc", "ko": "아무도 그 사람을 격려하지 않았다.", "ja": "だれも彼女を元気づける者はいなかった。", "en": "No one encouraged him.", "zh": "没有人鼓励他。", "wu": null, "m": null, "id": 1980, "r": {"ko": "amudo geu sarameul gyeokryeohaji anatda.", "jh": "だれもかのじょをげんきづけるものはいなかった", "jr": "dare mo kanojo o genki zukeru mono wa inakatta", "zh": "méi yǒu rén gǔ lì tā.", "wu": ""}}, {"u": "t_misc", "ko": "그 사람들이 이겼어.", "ja": "彼らは勝った。", "en": "They won.", "zh": "他们赢了。", "wu": null, "m": null, "id": 1981, "r": {"ko": "geu saramdeuri igyeosseo.", "jh": "かれらはかった", "jr": "karera wa katta", "zh": "tā men yíng le.", "wu": ""}}, {"u": "t_daily", "ko": "그는 나를 저녁 식사에 초대했다.", "ja": "彼は私を食事に招いてくれた。", "en": "He invited me to dinner.", "zh": "他邀请我吃晚饭。", "wu": null, "m": null, "id": 1982, "r": {"ko": "geuneun nareul jeonyeok siksae chodaehaetda.", "jh": "かれはわたしをしょくじにまねいてくれた", "jr": "kare wa watashi o shokuji ni maneite kureta", "zh": "tā yāo qǐng wǒ chī wǎn fàn.", "wu": ""}}, {"u": "t_misc", "ko": "저 사람을 따라가.", "ja": "後をつけろ。", "en": "Follow him.", "zh": "跟著他走。", "wu": null, "m": null, "id": 1983, "r": {"ko": "jeo sarameul ttaraga.", "jh": "あとをつけろ", "jr": "ato o tsukero", "zh": "gēn zhù tā zǒu.", "wu": ""}}, {"u": "t_health", "ko": "그는 아무에게도 말하지 않겠다고 내게 약속했다.", "ja": "彼は誰にも言わないと私に約束した。", "en": "He promised me that he won't tell anybody.", "zh": "他答应了我不会对任何人说。", "wu": null, "m": null, "id": 1984, "r": {"ko": "geuneun amuegedo malhaji anketdago naege yaksokhaetda.", "jh": "かれはだれにもいわないとわたしにやくそくした", "jr": "kare wa dare ni mo iwanai to watashi ni yakusoku shita", "zh": "tā dā yìng le wǒ bú huì duì rèn hé rén shuō.", "wu": ""}}, {"u": "t_misc", "ko": "누구나 죽어.", "ja": "人はすべて必ず死ぬ。", "en": "Everyone dies.", "zh": "人都是要死的。", "wu": null, "m": null, "id": 1985, "r": {"ko": "nuguna jugeo.", "jh": "ひとはすべてかならずしぬ", "jr": "hito wa subete kanarazu shinu", "zh": "rén dōu shì yào sǐ de.", "wu": ""}}, {"u": "t_misc", "ko": "더 빨리할수록 좋다.", "ja": "早ければ早い程よい。", "en": "The sooner, the better.", "zh": "越快越好。", "wu": null, "m": null, "id": 1986, "r": {"ko": "deo ppalrihalsurok jota.", "jh": "はやければはやいほどよい", "jr": "hayakereba hayai hodoyoi", "zh": "yuè kuài yuè hǎo.", "wu": ""}}, {"u": "t_feel", "ko": "너는 사과를 좋아합니다.", "ja": "りんごが好き。", "en": "You like apples.", "zh": "你喜欢苹果。", "wu": null, "m": null, "id": 1987, "r": {"ko": "neoneun sagwareul joahapnida.", "jh": "りんごがすき", "jr": "ringo ga suki", "zh": "nǐ xǐ huān píng guǒ.", "wu": ""}}, {"u": "t_ask", "ko": "잘 지내?", "ja": "元気してますか？", "en": "How are you?", "zh": "过得好吗？", "wu": null, "m": null, "id": 1988, "r": {"ko": "jal jinae?", "jh": "げんきしてますか", "jr": "genki shitemasuka", "zh": "guò dé hǎo ma?", "wu": "", "yue": "nei5 dim2 aa3?"}, "yue": "你點呀？", "yues": "c"}, {"u": "t_misc", "ko": "잘 지내요.", "ja": "私は元気です。", "en": "I'm fine.", "zh": "过得很好。", "wu": null, "m": null, "id": 1989, "r": {"ko": "jal jinaeyo.", "jh": "わたしはげんきです", "jr": "watashi wa genkidesu", "zh": "guò dé hěn hǎo.", "wu": ""}}, {"u": "t_misc", "ko": "우리는 동의해.", "ja": "意見が一致している。", "en": "We agree.", "zh": "我们同意。", "wu": null, "m": null, "id": 1990, "r": {"ko": "urineun donguihae.", "jh": "いけんがいっちしている", "jr": "iken ga itchi shiteiru", "zh": "wǒ men tóng yì.", "wu": ""}}, {"u": "t_daily", "ko": "지금 가요.", "ja": "いま行くよ。", "en": "I am coming.", "zh": "我来了。", "wu": null, "m ": "汉正街", "ko": "한정가", "note": "오랜 역사의 도매 시장 거리.", "sp": "汉正街", "py": "hàn zhèng jiē"}, {"id": 100057, "wu": "光谷", "zh": "光谷", "ko": "광구 (光谷)", "note": "우한 동쪽의 IT·청년 문화 지구.", "sp": "光谷", "py": "guāng gǔ"}, {"id": 100058, "wu": "楚河汉街", "zh": "楚河汉街", "ko": "추허한제", "note": "동호 근처 쇼핑·문화 거리.", "sp": "楚河汉街", "py": "chǔ hé hàn jiē"}, {"id": 100059, "wu": "武汉大学", "zh": "武汉大学", "ko": "우한대학", "note": "봄 벚꽃으로 유명한 캠퍼스.", "sp": "武汉大学", "py": "wǔ hàn dà xué"}, {"id": 100060, "wu": "长江大桥", "zh": "武汉长江大桥", "ko": "우한 창장대교", "note": "양쯔강에 놓인 첫 번째 다리.", "sp": "武汉长江大桥", "py": "cháng jiāng dà qiáo"}, {"id": 100061, "wu": "古琴台", "zh": "古琴台", "ko": "고금대", "note": "백아와 종자기 고사로 알려진 명소.", "sp": "古琴台", "py": "gǔ qín tái"}, {"id": 100062, "wu": "归元寺", "zh": "归元寺", "ko": "귀원사", "note": "우한의 대표 사찰.", "sp": "归元寺", "py": "guī yuán sì"}, {"id": 100063, "wu": "湖北省博物馆", "zh": "湖北省博物馆", "ko": "후베이성 박물관", "note": "증후을묘 편종 등 유물이 유명해요.", "sp": "湖北省博物馆", "py": "hú běi shěng bó wù guǎn"}, {"id": 100064, "wu": "鱼糕", "zh": "鱼糕", "ko": "어고 (생선 어묵)", "note": "후베이 명절 음식에 자주 올라오는 생선 요리.", "sp": "鱼糕", "py": "yú gāo"}, {"id": 100065, "wu": "糯米鸡", "zh": "糯米鸡", "ko": "찹쌀닭", "note": "연잎·찹쌀로 만든 후베이식 아침·간식.", "sp": "糯米鸡", "py": "nuò mǐ jī"}, {"id": 100066, "wu": "汤包", "zh": "灌汤包", "ko": "탕바오 (육즙 만두)", "note": "육즙이 든 작은 만두.", "sp": "灌汤包", "py": "tāng bāo"}, {"id": 100067, "wu": "烧梅", "zh": "烧卖", "ko": "샤오마이", "note": "우한 아침 메뉴로 자주 나오는 찹쌀 샤오마이.", "sp": "烧卖", "py": "shāo méi"}, {"id": 100068, "wu": "牛肉粉", "zh": "牛肉粉", "ko": "소고기 쌀국수", "note": "우한 아침 메뉴로 자주 먹는 쌀국수.", "sp": "牛肉粉", "py": "niú ròu fěn"}, {"id": 100069, "wu": "蛋酒", "zh": "蛋酒", "ko": "달걀 술", "note": "따뜻한 달걀 미주. 아침이나 겨울에 즐기는 음식.", "sp": "蛋酒", "py": "dàn jiǔ"}, {"id": 100070, "wu": "周黑鸭", "zh": "周黑鸭", "ko": "저우헤이야", "note": "우한 유명 오리 요리 브랜드.", "sp": "周黑鸭", "py": "zhōu hēi yā"}, {"id": 100071, "wu": "蔡林记", "zh": "蔡林记", "ko": "차이린지", "note": "열간면의 대표 노포 브랜드로 알려져 있어요.", "sp": "蔡林记", "py": "cài lín jì"}, {"id": 100072, "wu": "乖", "zh": "乖 / 好", "ko": "얌전하다, 착하다", "note": "후베이 말에서는 「乖」가 '착하다·귀엽다'는 뜻으로 폭넓게 쓰여요.", "sp": "乖", "py": "guāi"}]};
const LN={ko:'한국어',ja:'日本語',en:'English',zh:'中文 (표준)',zw:'중국어 + 우한말·대만어·광동어'};
const TTS={ko:'ko-KR',ja:'ja-JP',en:'en-US',zh:'zh-CN',zw:'zh-CN'};
const $=s=>document.querySelector(s);
const store=JSON.parse(localStorage.getItem('ml_state')||'{}');
const fixL=x=>x==='wu'?'zw':x;
const S={my:store.my==='wu'?'ko':(store.my||'ko'),lang:fixL(store.lang||'ja'),view:'home',unit:null,prog:store.prog||{},sess:null};
const save=()=>localStorage.setItem('ml_state',JSON.stringify({my:S.my,lang:S.lang,prog:S.prog}));
const INT=[0,1,3,7,14,30,60];
const DAY=864e5;
const uorder={};D.units.forEach((u,i)=>uorder[u.k]=i);
const tierOf={};D.units.forEach(u=>tierOf[u.k]=u.t);

const txt=(c,l)=>l==='zw'?c.zh:c[l];
function rom(c,l){
  if(l==='ko')return c.r.ko; if(l==='ja')return c.r.jh+'　'+c.r.jr; if(l==='zh')return c.r.zh;
  if(l==='zw')return c.r.zh; return '';}
const speakTxt=(c,l)=>l==='zw'?c.zh:c[l];
function mean(c){let m=txt(c,S.my);return c.m?m+'  ('+c.m+')':m}
const key=c=>S.lang+':'+c.id;
const P=c=>S.prog[key(c)]||{b:0,d:0};
function mark(c,good){const p=P(c);p.b=good?Math.min(INT.length-1,p.b+1):0;p.d=Date.now()+(good?INT[p.b]*DAY:0);S.prog[key(c)]=p;save()}
const known=c=>P(c).b>=3;
function items(unit){return D.c.filter(c=>!unit||c.u===unit)}
function due(){return D.c.filter(c=>{const p=S.prog[key(c)];return p&&p.d<=Date.now()}).sort((a,b)=>uorder[a.u]-uorder[b.u])}
function fresh(unit){return items(unit).filter(c=>!S.prog[key(c)])}


function hl(wu,zh){const z=new Set(zh);return [...wu].map(ch=>/[\u4e00-\u9fff]/.test(ch)&&!z.has(ch)?`<span style="color:#d23c3c;font-weight:800">${ch}</span>`:ch).join('')}
function wuBlock(c,small){
  const same=!c.wu||c.wu===c.zh;
  return `<div style="margin-top:10px;padding:10px;border-radius:12px;background:#fff6f0;border:1px solid #f3d3bd;text-align:${small?'left':'center'}">
   <span class="tag" style="background:#ffe4d1;color:#a24a10">우한말 武汉话</span>
   ${same?`<div class="${small?'':'big'}" style="${small?'font-size:18px':'font-size:26px'}">${c.zh}</div><div class="muted">표준어와 같아요</div>`
          :`<div style="${small?'font-size:18px':'font-size:28px'};line-height:1.4">${hl(c.wu,c.zh)}</div><div class="rom">${c.r.wu}</div>`}
   ${small?'':`<div class="row" style="justify-content:center;margin-top:6px"><button class="btn sec" onclick='speak(${JSON.stringify(c.zh)},"zh")'>🔊 (표준 발음으로 재생)</button></div>`}
  </div>`}
function dlBlock(c,key,label,bg,bd,fg,small){
  const t=c[key]; if(!t)return '';
  const sv=c[key+'s'];const src=sv==='m'?'':(sv==='c'?'<span class="st" title="Tatoeba 말뭉치의 연결된 번역">말뭉치</span>':'<span class="st" title="사전 자동 매칭">사전</span>');
  return `<div style="margin-top:8px;padding:8px 10px;border-radius:12px;background:${bg};border:1px solid ${bd};text-align:${small?'left':'center'}">
   <span class="tag" style="background:${bd};color:${fg}">${label}</span> ${src}
   <div style="font-size:${small?'17px':'24px'};line-height:1.4">${t}</div><div class="rom">${c.r[key]||''}</div></div>`}
const twBlock=(c,s)=>dlBlock(c,'tw','대만어 台語','#eef9f1','#cfe9d7','#1d6b3a',s);
const yueBlock=(c,s)=>dlBlock(c,'yue','광동어 粵語','#f2f0fb','#d9d3f3','#4b3fa3',s);
function show(c,l){
  let h=`<div class="big">${txt(c,l)}</div>${rom(c,l)?`<div class="rom">${rom(c,l)}</div>`:''}`;
  if(l==='zw')h=`<span class="tag">표준 중국어 普通话</span>`+h+wuBlock(c,false)+twBlock(c,false)+yueBlock(c,false);
  return h}

function speak(t,l){
  if(!('speechSynthesis' in window))return alert('이 브라우저는 음성 재생을 지원하지 않아요.');
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=TTS[l]||l;u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>x.lang.replace('_','-').startsWith(u.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
speechSynthesis&&speechSynthesis.getVoices();

function init(){
  for(const k in LN){['#my','#lang'].forEach(id=>{if(id==='#my'&&k==='zw')return;if(id==='#lang'&&k==='zh')return;$(id).add(new Option(LN[k],k))})}
  $('#my').value=S.my;$('#lang').value=S.lang;
  $('#my').onchange=()=>{S.my=$('#my').value;if(S.my===S.lang||(S.my==='zh'&&S.lang==='zw')){S.lang=S.my==='ja'?'en':'ja';$('#lang').value=S.lang}save();render()};
  $('#lang').onchange=()=>{S.lang=$('#lang').value;if(S.lang===S.my||(S.lang==='zw'&&S.my==='zh')){S.my=S.lang==='ko'?'zh':'ko';$('#my').value=S.my}save();render()};
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.unit=null;S.sess=null;render()});
  render();
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('#wuNote').classList.toggle('hide',S.lang!=='zw');
  const v=$('#view');
  ({home:vHome,search:vSearch,dict:vDict,review:vReview,quiz:vQuiz,words:vWords,prog:vProg})[S.view](v);
}

/* ---- 학습 홈 ---- */
function vHome(v){
  if(S.unit)return vUnit(v);
  const dn=due().length;let h='';
  if(dn)h+=`<div class="card">오늘 복습할 카드 <b>${dn}개</b> <button class="btn" style="margin-left:8px" onclick="S.view='review';render()">복습하기</button></div>`;
  h+=`<div class="muted" style="margin:0 2px 4px">순서대로 공부하면 일상에서 가장 많이 쓰는 말부터 익혀요.</div>`;
  for(const t of [1,2,3,4]){
    h+=`<div class="tier">${D.tiers[t]}</div><div class="units">`;
    for(const u of D.units.filter(x=>x.t===t)){
      const it=items(u.k),k=it.filter(known).length;
      h+=`<div class="unit" onclick="S.unit='${u.k}';S.sess=null;render()"><b>${u.e} ${u.n}</b><small>${k}/${it.length} 익힘</small><div class="bar"><i style="width:${k/it.length*100}%"></i></div></div>`}
    h+='</div>'}
  v.innerHTML=h}

function vUnit(v){
  const u=D.units.find(x=>x.k===S.unit),it=items(u.k);
  if(S.sess&&S.sess.mode==='study')return vStudy(v);
  let h=`<div class="row" style="margin:0 0 8px"><button class="btn sec" onclick="S.unit=null;render()">◀ 목록</button><b>${u.e} ${u.n}</b></div>
  <div class="card"><div class="row" style="margin:0"><button class="btn" onclick="startStudy('${u.k}')">▶ 학습 시작 (새 카드 ${fresh(u.k).length}개)</button>
  <button class="btn sec" onclick="startQuiz('${u.k}')">🎯 이 단원 퀴즈</button></div></div><div class="card list">`;
  it.forEach(c=>{h+=`<div class="it"><div class="t"><b>${txt(c,S.lang)}</b><br><span class="muted">${rom(c,S.lang)}</span>${S.lang==='zw'?wuBlock(c,true)+twBlock(c,true)+yueBlock(c,true):''}<br><span class="muted">${mean(c)}</span></div>
   <span class="st ${known(c)?'k':''}">${known(c)?'익힘':P(c).d?'학습중':'새'}</span><button class="btn sec" onclick='speak(${JSON.stringify(speakTxt(c,S.lang))},"${S.lang}")'>🔊</button></div>`});
  v.innerHTML=h+'</div>'}

/* ---- 카드 학습 ---- */
function startStudy(unit){let q=fresh(unit);if(!q.length)q=items(unit).filter(c=>!known(c));if(!q.length)q=items(unit);
  S.sess={mode:'study',q:[...q],i:0,show:false,unit,done:0};render()}
function vStudy(v){return runCards(v,()=>{S.unit=S.sess.unit;S.sess=null;render()})}
function runCards(v,back){
  const s=S.sess;
  if(!s.q.length){v.innerHTML=`<div class="card"><div class="big">🎉 완료!</div><p class="muted">오늘 ${s.done}개를 공부했어요.</p><button class="btn" id="bk">돌아가기</button></div>`;$('#bk').onclick=back;return}
  const c=s.q[0];
  v.innerHTML=`<div class="muted" style="margin:0 2px 6px">남은 카드 ${s.q.length}개</div>
  <div class="card" style="text-align:center">
   ${show(c,S.lang)}
   <div class="row" style="justify-content:center"><button class="btn sec" id="sp">🔊 듣기</button></div>
   <div class="mean ${s.show?'':'hide'}" id="mn">${mean(c)}</div>
   <div class="row" style="justify-content:center">
    ${s.show?`<button class="btn bad" id="no">몰라요</button><button class="btn ok" id="yes">알아요</button>`:`<button class="btn" id="rv">뜻 보기</button>`}
   </div></div>
   <div class="row" style="margin:0"><button class="btn sec" id="bk">◀ 그만하기</button></div>`;
  $('#sp').onclick=()=>speak(speakTxt(c,S.lang),S.lang);
  $('#bk').onclick=back;
  if(!s.show){$('#rv').onclick=()=>{s.show=true;render()};setTimeout(()=>speak(speakTxt(c,S.lang),S.lang),150)}
  else{ $('#yes').onclick=()=>{mark(c,true);s.q.shift();s.done++;s.show=false;render()};
        $('#no').onclick=()=>{mark(c,false);s.q.push(s.q.shift());s.show=false;render()}}}

/* ---- 복습 ---- */
function vReview(v){
  if(!S.sess||S.sess.mode!=='review'){const q=due().slice(0,20);S.sess={mode:'review',q,done:0,show:false}}
  if(!S.sess.q.length&&!S.sess.done){v.innerHTML=`<div class="card"><div class="big">✨ 복습할 카드가 없어요</div><p class="muted">학습 탭에서 새 단원을 시작해 보세요.</p></div>`;return}
  runCards(v,()=>{S.view='home';S.sess=null;render()})}

/* ---- 퀴즈 ---- */
function startQuiz(unit){
  let pool=unit?items(unit):D.c.filter(c=>S.prog[key(c)]);
  if(pool.length<4)pool=D.c.filter(c=>tierOf[c.u]<=(unit?tierOf[unit]:1));
  S.sess={mode:'quiz',unit,pool,n:0,ok:0,total:10,cur:null};S.view='quiz';S.unit=null;render()}
function vQuiz(v){
  const s=S.sess;
  if(!s||s.mode!=='quiz'){
    v.innerHTML=`<div class="card"><b>🎯 퀴즈</b><p class="muted">틀린 문제는 복습 카드에 다시 들어가요. 10문제씩.</p><div class="row">
    <button class="btn" onclick="startQuiz(null)">배운 내용 전체</button>
    <button class="btn sec" onclick="S.view='home';render()">단원별 퀴즈는 학습 탭에서</button></div></div>`;return}
  if(s.n>=s.total){v.innerHTML=`<div class="card"><div class="big">${s.ok} / ${s.total}</div><p class="muted">${s.ok>=9?'완벽해요!':s.ok>=7?'잘했어요!':'조금 더 복습하면 좋아요.'}</p>
   <div class="row"><button class="btn" onclick="startQuiz(${s.unit?`'${s.unit}'`:'null'})">다시</button><button class="btn sec" onclick="S.sess=null;S.view='home';render()">학습으로</button></div></div>`;return}
  const c=s.pool[Math.floor(Math.random()*s.pool.length)];
  const types=['listen','tr','rt'];const type=('speechSynthesis' in window)?types[Math.floor(Math.random()*3)]:types[1+Math.floor(Math.random()*2)];
  const dist=[];const pool=D.c.filter(x=>x.id!==c.id&&(x.u===c.u||dist.length<3));
  const sh=a=>a.sort(()=>Math.random()-.5);
  let others=sh(D.c.filter(x=>x.id!==c.id&&x.u===c.u)).slice(0,3);
  if(others.length<3)others=others.concat(sh(D.c.filter(x=>x.id!==c.id&&!others.includes(x))).slice(0,3-others.length));
  const opts=sh([c,...others]);
  const q=type==='rt'?`<div class="mean" style="margin:0">${mean(c)}</div><div class="muted">${LN[S.lang]}로 뭐라고 해요?</div>`
      :type==='listen'?`<div class="row" style="margin:0"><button class="btn" id="lp">🔊 듣고 뜻 고르기</button></div>`
      :`${show(c,S.lang)}<div class="muted" style="margin-top:8px">무슨 뜻일까요?</div>`;
  v.innerHTML=`<div class="muted" style="margin:0 2px 6px">${s.n+1} / ${s.total} · 정답 ${s.ok}</div><div class="card">${q}<div id="op" style="margin-top:8px"></div></div>
  <div class="row" style="margin:0"><button class="btn sec" onclick="S.sess=null;S.view='home';render()">◀ 그만하기</button></div>`;
  if(type==='listen'){$('#lp').onclick=()=>speak(speakTxt(c,S.lang),S.lang);setTimeout(()=>speak(speakTxt(c,S.lang),S.lang),200)}
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=type==='rt'?txt(o,S.lang):mean(o);
    b.onclick=()=>{const good=o.id===c.id;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      b.classList.add(good?'right':'wrong');if(!good)[...document.querySelectorAll('.opt')].find(x=>x.textContent===(type==='rt'?txt(c,S.lang):mean(c))).classList.add('right');
      mark(c,good);if(good)s.ok++;s.n++;
      const nx=document.createElement('div');nx.className='row';nx.innerHTML='<button class="btn">다음</button>';nx.firstChild.onclick=render;$('#op').appendChild(nx)};
    $('#op').appendChild(b)})}



/* ---- 사전 (오프라인 사전 전체 검색) ---- */
const DICTS={
 cedict:{n:'중국어 CC-CEDICT',f:'dict/cedict.json',lic:'CC BY-SA 4.0 · MDBG',kind:'zh'},
 ccanto:{n:'광동어 CC-Canto',f:'dict/ccanto.json',lic:'CC BY-SA 3.0 · Pleco',kind:'yue'},
 taigi:{n:'대만어 台華線頂對照典',f:'dict/taigi.json',lic:'CC BY-SA 4.0 · 楊允言·鄭良偉 외 · ChhoeTaigi',kind:'tw'},
 jmdict:{n:'일본어 JMdict',f:'dict/jmdict.json',lic:'CC BY-SA 4.0 · EDRDG',kind:'ja'},
 kengdic:{n:'한국어 Kengdic',f:'dict/kengdic.json',lic:'MPL 2.0 / LGPL',kind:'ko'}};
const DCACHE={};S.dk=S.dk||'cedict';S.dq=S.dq||'';
async function loadDict(k){
  if(DCACHE[k])return DCACHE[k];
  const r=await fetch(DICTS[k].f);if(!r.ok)throw new Error('사전을 불러오지 못했어요 (파일 열기 방식에서는 로컬 서버가 필요해요)');
  const rows=await r.json();const kind=DICTS[k].kind;
  const idx=rows.map(r=>({r,t:plain(r.join(' ')),n:plain(r.join(' ')).replace(/[\s.,?!;'-]/g,'')}));
  return DCACHE[k]={rows,idx}}
function dictLine(k,r){
  if(k==='cedict')return `<b style="font-size:20px">${r[0]}${r[1]!==r[0]?` <span class="muted">(${r[1]})</span>`:''}</b> <span class="rom">${r[2]}</span><div class="mean" style="font-size:16px">${r[3]}</div>`;
  if(k==='ccanto')return `<b style="font-size:20px">${r[0]}</b> <span class="rom">${r[2]}</span><div class="mean" style="font-size:16px">${r[3]}</div>`;
  if(k==='taigi')return `<b style="font-size:20px">${r[0]||r[1]}</b> <span class="rom">${r[1]}</span> <span class="muted">(POJ ${r[2]})</span><div class="mean" style="font-size:16px">${r[3]}</div>`;
  if(k==='jmdict')return `<b style="font-size:20px">${r[0]||r[1]}</b> ${r[0]?`<span class="rom">${r[1]}</span>`:''} ${r[3]?'<span class="st k">자주 씀</span>':''}<div class="mean" style="font-size:16px">${r[2]}</div>`;
  return `<b style="font-size:20px">${r[0]}</b> ${r[1]?`<span class="muted">(${r[1]})</span>`:''}<div class="mean" style="font-size:16px">${r[2]}</div>`}
function vDict(v){
  v.innerHTML=`<div class="card"><b>📖 사전 검색</b> <span class="muted">· 오프라인 오픈 사전 5종</span>
   <div class="row" style="margin-top:8px"><select id="dk" style="border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit">${Object.entries(DICTS).map(([k,d])=>`<option value="${k}" ${S.dk===k?'selected':''}>${d.n}</option>`).join('')}</select></div>
   <input id="dq" type="search" placeholder="단어 · 발음 · 영어 뜻으로 검색" value="${S.dq.replace(/"/g,'&quot;')}" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin-top:8px">
   <div class="muted" id="dcnt" style="margin-top:6px"></div><div class="muted" id="dlic" style="font-size:12px"></div><div class="muted" style="font-size:12px;margin-top:4px">출처·라이선스 전체: <a href="NOTICES.md" target="_blank">NOTICES.md</a></div></div><div id="dres"></div>`;
  const run=async()=>{S.dk=$('#dk').value;S.dq=$('#dq').value;await doDict()};
  $('#dk').onchange=run;
  let tm=null;$('#dq').oninput=()=>{clearTimeout(tm);tm=setTimeout(run,160)};
  doDict();if(!S.dq)$('#dq').focus()}
async function doDict(){
  const k=S.dk,q=plain(S.dq.trim());$('#dlic').textContent='라이선스: '+DICTS[k].lic;
  if(!q){$('#dcnt').textContent='검색어를 입력하세요. 처음 한 번은 사전 파일을 불러오느라 몇 초 걸려요.';$('#dres').innerHTML='';return}
  $('#dcnt').textContent='불러오는 중...';
  let d;try{d=await loadDict(k)}catch(e){$('#dcnt').textContent=e.message;return}
  if(k!==S.dk)return;
  const terms=q.split(/\s+/).filter(Boolean),qn=q.replace(/[\s.,?!;'-]/g,'');
  let res=d.idx.filter(x=>terms.every(t=>x.t.includes(t))||x.n.includes(qn));
  const esc=[...q].map(ch=>'.*+?^${}()|[]'.includes(ch)||ch===String.fromCharCode(92)?String.fromCharCode(92)+ch:ch).join('');
  const wordRe=new RegExp('(^|[;,/ ])'+esc+'($|[;,/ ])');
  const rank=x=>{const kind=DICTS[k].kind;
    const f=x.r[0]?plain(x.r[0]):'',g=plain(x.r[kind==='ja'?2:(x.r.length-1)]||'');
    const gl=g.split(/[;,/]/).map(t=>t.trim().replace(/^(to|a|an|the) /,'').replace(/ \(.*$/,'').trim());
    const heads=[x.r[0],x.r[1]].filter(Boolean).flatMap(t=>String(t).split('・')).map(plain);
    if(heads.includes(q))return 0;                               // 표제어/읽기 정확히 일치
    if(gl[0]===q)return 1;                                       // 뜻풀이 첫 번째가 정확히 일치
    if(gl.some(t=>t===q))return 2;                               // 뜻풀이 중 하나가 정확히 일치
    if(heads.some(t=>t.startsWith(q)))return 3;if(wordRe.test(g))return 4;if(heads.some(t=>t.includes(q)))return 5;return 6};
  const common=x=>DICTS[k].kind==='ja'?(x.r[3]?0:1):0;
  res=res.map(x=>({x,rk:rank(x),cm:common(x),len:x.r.join('').length})).sort((a,b)=>a.rk-b.rk||a.cm-b.cm||a.len-b.len).map(o=>[o.rk,o.len,o.x]);
  $('#dcnt').textContent=`${res.length.toLocaleString()}개 결과`+(res.length>60?' · 상위 60개만 표시':'');
  $('#dres').innerHTML=res.slice(0,60).map(([,,x])=>`<div class="card" style="padding:10px 12px">${dictLine(k,x.r)}</div>`).join('')||'<div class="card muted">결과가 없어요.</div>'}

/* ---- 검색 ---- */
const plain=x=>(x||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let SIDX=null;
function buildIndex(){
  SIDX=D.c.map(c=>{const t=plain([c.ko,c.ja,c.en,c.zh,c.wu||'',c.tw||'',c.yue||'',c.r.ko,c.r.jh,c.r.jr,c.r.zh,c.r.wu,c.r.tw||'',c.r.yue||'',(D.units.find(u=>u.k===c.u)||{}).n,c.m||''].join(' '));return {c,t,n:t.replace(/[\s.,?!。，？！、'’-]/g,'')}});
  SWORDS=D.words.map(w=>{const t=plain([w.wu,w.zh,w.ko,w.note,w.py].join(' '));return {w,t,n:t.replace(/[\s.,?!。，？！、'’-]/g,'')}});
}
let SWORDS=[];
S.q=S.q||'';S.su='';S.sk='all';
function hlq(txt,q){
  if(!q)return txt; const i=plain(txt).indexOf(q); if(i<0||plain(txt).length!==txt.length)return txt;
  return txt.slice(0,i)+'<mark>'+txt.slice(i,i+q.length)+'</mark>'+txt.slice(i+q.length)}
function vSearch(v){
  if(!SIDX)buildIndex();
  const opts='<option value="">모든 단원</option>'+D.units.map(u=>`<option value="${u.k}" ${S.su===u.k?'selected':''}>${u.e} ${u.n}</option>`).join('');
  v.innerHTML=`<div class="card"><input id="sq" type="search" placeholder="🔍 한국어·日本語·English·中文·우한말·발음 (예: 화장실, toire, hello, nihao, 咯)" value="${S.q.replace(/"/g,'&quot;')}" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit">
   <div class="row" style="margin-top:8px"><select id="su" style="border:1px solid var(--line);border-radius:10px;padding:8px">${opts}</select>
   <label style="font-size:14px"><input type="checkbox" id="sk" ${S.sk==='new'?'checked':''}> 아직 안 익힌 것만</label></div>
   <div class="muted" id="scnt" style="margin-top:6px"></div></div><div id="sres"></div>`;
  const run=()=>{S.q=$('#sq').value;S.su=$('#su').value;S.sk=$('#sk').checked?'new':'all';doSearch()};
  $('#sq').oninput=run;$('#su').onchange=run;$('#sk').onchange=run;doSearch();
  if(!S.q)$('#sq').focus()}
function doSearch(){
  const q=plain(S.q.trim()),terms=q.split(/\s+/).filter(Boolean);
  let res=SIDX.filter(x=>(!S.su||x.c.u===S.su)&&(!terms.length||terms.every(t=>x.t.includes(t))||x.n.includes(q.replace(/[\s.,?!。，？！、'’-]/g,'')))&&(S.sk!=='new'||!known(x.c)));
  // 정렬: 정확히 일치 > 앞부분 일치 > 그 외, 같으면 단계 순
  const score=x=>{if(!q)return 0;const f=[x.c.ko,x.c.ja,x.c.en,x.c.zh,x.c.wu||''].map(plain);
    if(f.some(s=>s===q))return -3;if(f.some(s=>s.startsWith(q)))return -2;if(f.some(s=>s.includes(q)))return -1;return 0};
  res=res.sort((a,b)=>score(a)-score(b)||uorder[a.c.u]-uorder[b.c.u]||a.c.id-b.c.id);
  const wr=(!S.su&&terms.length)?SWORDS.filter(x=>terms.every(t=>x.t.includes(t))||x.n.includes(q.replace(/[\s.,?!。，？！、'’-]/g,''))):[];
  $('#scnt').textContent=terms.length||S.su?`문장·단어 ${res.length}개`+(wr.length?` · 우한말 단어 ${wr.length}개`:''):`전체 ${SIDX.length}개 · 검색어를 입력하세요`;
  const tl=q;let h='';
  res.slice(0,80).forEach(({c})=>{
    const un=D.units.find(u=>u.k===c.u);
    h+=`<div class="card" style="padding:11px"><div class="row" style="margin:0 0 4px"><span class="tag">${un.e} ${un.n}</span><span class="st ${known(c)?'k':''}">${known(c)?'익힘':'새'}</span></div>
     <div style="font-size:19px"><b>${hlq(c.ko,tl)}</b></div>
     <div class="muted">🇯🇵 ${hlq(c.ja,tl)} <span class="rom" style="font-size:12px">${c.r.jr}</span></div>
     <div class="muted">🇬🇧 ${hlq(c.en,tl)}</div>
     <div class="muted">🇨🇳 ${hlq(c.zh,tl)} <span class="rom" style="font-size:12px">${c.r.zh}</span></div>
     ${c.tw?`<div class="muted" style="color:#1d6b3a">대만어 ${c.tw} <span class="rom" style="font-size:12px">${c.r.tw||''}</span></div>`:''}
     ${c.yue?`<div class="muted" style="color:#4b3fa3">광동어 ${c.yue} <span class="rom" style="font-size:12px">${c.r.yue||''}</span></div>`:''}
     ${c.wu&&c.wu!==c.zh?`<div class="muted" style="color:#a24a10">우한말 ${hl(c.wu,c.zh)} <span class="rom" style="font-size:12px">${c.r.wu}</span></div>`:''}
     <div class="row" style="margin-top:6px"><button class="btn sec" style="padding:6px 12px" data-sp="${c.id}" data-l="ko">🔊 한</button>
      <button class="btn sec" style="padding:6px 12px" data-sp="${c.id}" data-l="ja">🔊 일</button>
      <button class="btn sec" style="padding:6px 12px" data-sp="${c.id}" data-l="en">🔊 영</button>
      <button class="btn sec" style="padding:6px 12px" data-sp="${c.id}" data-l="zh">🔊 중</button>
      <button class="btn" style="padding:6px 12px" data-go="${c.u}">단원 열기</button></div></div>`});
  if(res.length>80)h+=`<div class="muted" style="text-align:center">상위 80개만 표시합니다. 검색어를 더 구체적으로 입력해 보세요.</div>`;
  if(wr.length){h+=`<div class="tier">🍜 우한말 단어</div><div class="card">`;
    wr.slice(0,30).forEach(({w})=>{h+=`<div class="w"><b>${w.wu}</b> <span class="rom">${w.py}</span> <button class="btn sec" style="padding:4px 10px" data-wsp="${w.id}">🔊</button><div class="mean" style="margin-top:2px">${w.ko}</div><div class="muted">표준어: ${w.zh}</div><div class="muted">${w.note}</div></div>`});
    h+='</div>'}
  if(!res.length&&!wr.length&&(terms.length||S.su))h='<div class="card muted">검색 결과가 없어요. 다른 단어나 발음으로 찾아 보세요.</div>';
  $('#sres').innerHTML=h;
  $('#sres').querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const c=D.c.find(x=>x.id==b.dataset.sp);speak(c[b.dataset.l],b.dataset.l)});
  $('#sres').querySelectorAll('[data-wsp]').forEach(b=>b.onclick=()=>{const w=D.words.find(x=>x.id==b.dataset.wsp);speak(w.sp,'zh')});
  $('#sres').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.view='home';S.unit=b.dataset.go;S.sess=null;render();window.scrollTo(0,0)})}

/* ---- 진도 ---- */
function vProg(v){
  const all=D.c,k=all.filter(known).length,st=all.filter(c=>S.prog[key(c)]).length;
  let h=`<div class="card"><b>${LN[S.lang]}</b><div class="big">${k} / ${all.length} 익힘</div><div class="muted">시작한 카드 ${st}개 · 오늘 복습 ${due().length}개</div><div class="bar"><i style="width:${k/all.length*100}%"></i></div></div>`;
  for(const t of [1,2,3,4]){const it=all.filter(c=>tierOf[c.u]===t),kk=it.filter(known).length;
    h+=`<div class="card"><b>${D.tiers[t]}</b> <span class="muted">${kk}/${it.length}</span><div class="bar"><i style="width:${kk/it.length*100}%"></i></div></div>`}
  h+=`<div class="card"><div class="muted">진도는 이 브라우저에만 저장됩니다.</div><div class="row"><button class="btn bad" onclick="if(confirm('이 언어의 진도를 초기화할까요?')){for(const k in S.prog)if(k.startsWith(S.lang+':'))delete S.prog[k];save();render()}">이 언어 진도 초기화</button></div></div>`;
  v.innerHTML=h}
init();
</script>
</body>
</html>
